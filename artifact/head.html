<title>Casing Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a working app - fixed header, one scrolling column of panels; the schematic and
   pressure window sit beside their forms on wide screens and stack on phones. */
:root { --bg:#f3f5f7; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9dfe6; --ok:#1d7f49; --bad:#b93a2d; --warn:#8a5a00;
  --accent:#1f5fbf; --accent-soft:#e6eefb; --hole:#c9a66b; --cement:#9aa6b4;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif; --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12171e; --panel:#1a212b; --ink:#e6ebf1; --muted:#99a5b3; --line:#2a3440; --ok:#4fc27c; --bad:#ef7b6e; --warn:#e0a94a; --accent:#6ea2ff; --accent-soft:#1f2c42; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#12171e; --panel:#1a212b; --ink:#e6ebf1; --muted:#99a5b3; --line:#2a3440; --ok:#4fc27c; --bad:#ef7b6e; --warn:#e0a94a; --accent:#6ea2ff; --accent-soft:#1f2c42; color-scheme: dark; }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-ui) }
header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:flex; align-items:center; gap:14px; padding-block:9px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); background:var(--panel) }
header h1 { font-size:17px; margin:0; letter-spacing:.01em } header a { color:inherit; text-decoration:none } header .spacer { flex:1 } header .muted { font-size:12px }
main { max-width:1180px; margin:0 auto; padding-block:18px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); min-width:0 }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; min-width:0 }
h2 { font-size:15px; margin:0 0 10px; text-wrap:balance } h3 { font-size:13px; margin:12px 0 4px } h4 { font-size:12px; color:var(--muted); margin:10px 0 0; font-weight:600; letter-spacing:.03em; text-transform:uppercase }
.muted { color:var(--muted) } .small { font-size:12px } .pass { color:var(--ok); font-weight:600 } .fail { color:var(--bad); font-weight:600 } .warn { color:var(--warn) }
button, select, input { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--ink) }
input, select { font-variant-numeric: tabular-nums } button { cursor:pointer } button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600 } button.big { padding:12px 22px; font-size:15px } button.link { border:none; background:none; color:var(--accent); padding:4px 6px }
button.x { border:none; background:none; color:var(--bad); font-size:16px; padding:0 6px } button:disabled { opacity:.5; cursor:default }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 }
.steps { display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap } .steps button { border-radius:999px; padding:7px 14px } .steps button[aria-current="step"] { background:var(--accent); color:#fff; border-color:var(--accent) }
.steps button.done::before { content:"✓ "; color:var(--ok) } .steps button[aria-current="step"].done::before { color:#fff }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 12px; margin:6px 0 }
.f { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); min-width:0 } .f.wide { grid-column:1/-1 }
.f input, .f select { width:100%; padding:6px 8px; font-size:13px; color:var(--ink) } .f input[type=checkbox] { width:auto; align-self:flex-start; margin-top:6px }
.f.bad input, .f.bad select { border-color:var(--bad) } .f.warnish input { border-color:var(--warn) } .f small { font-size:11px; line-height:1.3 }
table { border-collapse:collapse; width:100%; margin:6px 0; font-variant-numeric:tabular-nums } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line) } th { color:var(--muted); font-weight:600; font-size:12px }
.tbl { overflow-x:auto } table.edit td { padding:2px 4px } table.edit input { width:100px; padding:4px 6px }
details { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:8px 0 } summary { cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px }
details.sub { border:none; border-top:1px dashed var(--line); border-radius:0; padding:6px 0 0; margin:10px 0 0 } details.sub summary { font-size:12px; color:var(--muted) }
.chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:999px; padding:3px 9px 3px 6px; font-size:12px; background:var(--bg) } .chip input { margin:0 }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px }
.card { border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--panel); min-width:0 } .card h3 { margin:0 0 4px; font-size:14px } .card .pipe { font-size:16px; font-weight:600; margin:6px 0 }
.card .dfs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0 } .card .df { background:var(--bg); border-radius:7px; padding:6px 8px; font-size:12px } .card .df b { display:block; font-size:15px; font-family:var(--font-num) }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600 } .badge.pass { background:color-mix(in srgb, var(--ok) 15%, var(--panel)); color:var(--ok) } .badge.fail { background:color-mix(in srgb, var(--bad) 15%, var(--panel)); color:var(--bad) } .badge.info { background:var(--accent-soft); color:var(--accent) }
.plots { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr)); gap:12px; margin-top:10px } .plot { height:400px; min-width:0 }
.projects { list-style:none; padding:0; margin:0 } .projects li { display:flex; gap:12px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line); flex-wrap:wrap } .projects a, .projects .name { color:inherit; text-decoration:none; font-weight:600; cursor:pointer } .projects .spacer { flex:1 }
.empty { text-align:center; padding:40px 20px; color:var(--muted) } .err { color:var(--bad); white-space:pre-wrap; margin:8px 0 }
.toast { position:fixed; right:max(16px, env(safe-area-inset-right, 0px)); bottom:max(16px, env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none } .toast.show { opacity:1 }
.hero { text-align:center; padding:26px 10px } .hero p { color:var(--muted); max-width:560px; margin:8px auto 18px }
.guide { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:8px 14px; margin:0 0 12px; background:var(--accent-soft); font-size:13px } .guide ul { margin:4px 0 2px; padding-left:18px } .how ol { margin:0; padding-left:20px } .how li { margin:4px 0 }
.two { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start } .two.wide-left { grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr) } .two .panel { margin-bottom:0 } .two > .panel:last-child { position:sticky; top:56px }
svg.schematic { width:100%; height:auto; display:block } .schematic .ground { stroke:var(--ink); stroke-width:2 } .schematic .hole { fill:var(--hole); opacity:.35 } .schematic .cement { fill:var(--cement); opacity:.7 } .schematic .casing { fill:var(--panel); stroke:var(--ink); stroke-width:1.5 } .schematic .casing.liner { stroke:var(--accent) } .schematic .lbl { font:11px var(--font-ui); fill:var(--ink) } .schematic .lbl.muted { fill:var(--muted) }
.report h1 { font-size:20px; margin:0 } .report h2 { font-size:15px; margin:22px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px } .report .meta { color:var(--muted); font-size:12px }
.confirm { display:inline-flex; gap:6px; align-items:center }
@media (prefers-reduced-motion: reduce) { .toast { transition:none } }
@media (max-width:900px) { .two, .two.wide-left { grid-template-columns:1fr } .two > .panel:last-child { position:static } }
@media (max-width:700px) { header .muted { display:none } .panel { padding:12px } .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)) } .steps button { padding:6px 10px; font-size:12px } .hero { padding:12px 4px } button.big { padding:10px 14px; font-size:14px; width:100% } .hero .row { flex-direction:column; align-items:stretch } table.edit input { width:84px } .plot { height:320px } .card .dfs { grid-template-columns:repeat(2,1fr) } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
