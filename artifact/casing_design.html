<title>Casing Design</title>
<meta name="claude:viewport-fit-sides" content="cover">

/* Layout: a working app - fixed header, one scrolling column of panels; the schematic and
   pressure window sit beside their forms on wide screens and stack on phones. */
:root { --bg:#f3f5f7; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9dfe6; --ok:#1d7f49; --bad:#b93a2d; --warn:#8a5a00;

header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:flex; align-items:center; gap:14px; padding-block:9px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); background:var(--panel) }
header h1 { font-size:17px; margin:0; letter-spacing:.01em } header a { color:inherit; text-decoration:none } header .spacer { flex:1 } header .muted { font-size:12px }
main { max-width:1180px; margin:0 auto; padding-block:18px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); min-width:0 }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; min-width:0 }
h2 { font-size:15px; margin:0 0 10px; text-wrap:balance } h3 { font-size:13px; margin:12px 0 4px } h4 { font-size:12px; color:var(--muted); margin:10px 0 0; font-weight:600; letter-spacing:.03em; text-transform:uppercase }
.muted { color:var(--muted) } .small { font-size:12px } .pass { color:var(--ok); font-weight:600 } .fail { color:var(--bad); font-weight:600 } .warn { color:var(--warn) }

input, select { font-variant-numeric: tabular-nums } button { cursor:pointer } button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600 } button.big { padding:12px 22px; font-size:15px } button.link { border:none; background:none; color:var(--accent); padding:4px 6px }
button.x { border:none; background:none; color:var(--bad); font-size:16px; padding:0 6px } button:disabled { opacity:.5; cursor:default }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 12px; margin:6px 0 }
.f { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); min-width:0 } .f.wide { grid-column:1/-1 }
