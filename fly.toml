# Fly.io deployment: `fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy`
app = "casingdesign"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  CASINGDESIGN_DB = "/data/casingdesign.db"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
