<title>Eko Island Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: survey-station console. Map + elevation strip on the left, field log on the right; stacks on phones. */
:root {
  --bg: #e9eef0;
  --panel: #f7f9fa;
  --ink: #14232b;
  --muted: #5b6b73;
  --line: #cfd8dc;
  --accent: #2f3bb0;
  --accent-soft: #dfe2fb;
  --signal: #c2410c;
  --note: #0f766e;
  --note-soft: #d6efec;
  --warn: #a16207;
  --chip: #e1e7ea;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1519; --panel: #152027; --ink: #dfe8ec; --muted: #8fa1a9; --line: #26343c;
    --accent: #9aa3ff; --accent-soft: #232a55; --signal: #fb923c; --note: #5eead4; --note-soft: #12332f;
    --warn: #facc15; --chip: #1d2a31; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1519; --panel: #152027; --ink: #dfe8ec; --muted: #8fa1a9; --line: #26343c;
  --accent: #9aa3ff; --accent-soft: #232a55; --signal: #fb923c; --note: #5eead4; --note-soft: #12332f;
  --warn: #facc15; --chip: #1d2a31; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 12px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.top .run { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.golink { text-decoration: none; color: var(--ink); margin-left: auto; }
.picker { display: grid; gap: 8px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); width: 64px; flex: none; }
.chip {
  border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 3px 9px; cursor: pointer;
  font-size: 13px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }
.chip .sc { font-family: var(--mono); font-size: 11px; opacity: 0.85; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.mapwrap { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; overflow: hidden; border-radius: 8px 8px 0 0; touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
.mapctl { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.mapctl button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-family: var(--mono); }
.mapctl button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.mapctl .wide { width: auto; padding: 0 8px; font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.hud { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-family: var(--mono); font-size: 12px; max-width: calc(100% - 16px); }
.hud b { font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.controls .btn { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.controls .play { background: var(--accent); color: var(--panel); border-color: var(--accent); min-width: 72px; font-weight: 600; }
.controls .step { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls select { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
.strip { padding: 0 12px 12px; }
#elev { width: 100%; height: 86px; display: block; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); padding: 0 12px 10px; }
.legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.side { display: flex; flex-direction: column; max-height: calc(100vh - 40px); position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 900px) { .side { max-height: none; position: static; } }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 9px 6px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 10px 12px 14px; min-height: 0; flex: 1; }
@media (max-width: 900px) { .pane { max-height: 70vh; } }
.now { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.now .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.now code { font-family: var(--mono); font-size: 12px; }
.ev { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.ev.future { opacity: 0.35; }
.ev.cur { background: var(--accent-soft); margin: 0 -12px; padding: 5px 12px; }
.ev .st { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .tx { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.ev.say .tx { font-size: 13.5px; }
.ev.think .tx { color: var(--muted); font-style: italic; font-size: 12.5px; }
.ev.act .tx { font-family: var(--mono); font-size: 12px; }
.ev.act .res { color: var(--muted); }
.ev.act.err .res { color: var(--warn); }
.ev.note .tx { background: var(--note-soft); border-left: 3px solid var(--note); padding: 4px 8px; border-radius: 0 4px 4px 0; font-size: 12.5px; }
.ev.note .p, .ev.read .tx { font-family: var(--mono); font-size: 11px; color: var(--note); }
.ev.rule .tx { color: var(--signal); font-weight: 600; }
.ev.nudge .tx { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.filters label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.nfile { margin-bottom: 12px; }
.nfile h3 { font-family: var(--mono); font-size: 12px; font-weight: 500; margin: 0 0 4px; color: var(--note); display: flex; gap: 8px; align-items: center; }
.nfile .fresh { font-family: var(--body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; background: var(--note); color: var(--panel); padding: 1px 6px; border-radius: 4px; }
.nfile pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--body); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.nfile.new pre { border-color: var(--note); }
.empty { color: var(--muted); font-style: italic; }
dl.info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0 0 12px; }
dl.info dt { color: var(--muted); font-size: 12px; }
dl.info dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.opening { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
h2.sec { font-family: var(--display); font-size: 1rem; font-weight: 500; margin: 14px 0 6px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <h1>Eko Island Replay</h1>
  <span class="run" id="runlbl"></span>
  <a class="chip golink" id="other" hidden target="_blank" rel="noopener">Open the 3D view ↗</a>
</header>

<section class="picker" aria-label="Choose a session">
  <div class="row" id="runs"><span class="lbl">Run</span></div>
  <div class="row" id="agents"><span class="lbl">Agent</span></div>
  <div class="row" id="days"><span class="lbl">Free play</span></div>
  <div class="row" id="tasks"><span class="lbl">Tasks</span></div>
</section>

<main class="grid">
  <section class="card">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Top-down map of the island with the agent and objects"></canvas>
      <div class="mapctl">
        <button id="follow" class="wide" aria-pressed="false" title="Keep the agent centred">Follow</button>
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
        <button id="zreset" class="wide" title="Show the whole island">Fit</button>
      </div>
      <div class="hud" id="hud"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="controls">
      <button class="btn play" id="play">Play</button>
      <button class="btn" id="prev" title="Previous step (←)">◀</button>
      <button class="btn" id="next" title="Next step (→)">▶</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step">
      <span class="step" id="stepn">step 0 / 0</span>
      <label class="step" for="speed">speed</label>
      <select id="speed">
        <option value="1">1 step/s</option>
        <option value="2" selected>2 steps/s</option>
        <option value="4">4 steps/s</option>
        <option value="8">8 steps/s</option>
        <option value="16">16 steps/s</option>
      </select>
    </div>
    <div class="strip"><canvas id="elev" aria-label="Agent height over the session, with events"></canvas></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>agent height</span>
      <span><i style="background:var(--signal)"></i>hidden rule fired</span>
      <span><i style="background:var(--note)"></i>note written</span>
      <span><i style="background:var(--muted)"></i>stop nudge</span>
      <span>dashed: Spire top · dotted: Peak summit</span>
    </div>
  </section>

  <aside class="card side">
    <div class="now" id="now"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-log" aria-selected="true">Field log</button>
      <button role="tab" id="t-notes" aria-selected="false">Notes</button>
      <button role="tab" id="t-info" aria-selected="false">Session</button>
    </div>
    <div class="filters" id="filters">
      <label><input type="checkbox" id="f-say" checked> speech</label>
      <label><input type="checkbox" id="f-think"> thinking</label>
      <label><input type="checkbox" id="f-act" checked> actions</label>
      <label><input type="checkbox" id="f-note" checked> notes</label>
      <label><input type="checkbox" id="f-nudge"> nudges</label>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<script>
const DATA = /*__DATA__*/null;
(function () {
  if (!DATA) { document.body.insertAdjacentHTML("beforeend", "<p>No run data embedded. Generate this page with <code>python run.py viewer --run-id &lt;id&gt;</code>.</p>"); return; }
  const $ = (id) => document.getElementById(id);
  const T = DATA.terrain, SIZE = T.size, N = T.n;
  const COL = { red: "#d33b2f", orange: "#ef8a1c", yellow: "#f2cf1d", green: "#3fa34d", blue: "#2d6fd6", purple: "#7b45c4",
    pink: "#ef7fb6", white: "#f4f4ef", black: "#202024", grey: "#8c9196", brown: "#8a5a2b", teal: "#159c9c", stone: "#9e9484", gold: "#d9a520", golden: "#e8b923" };
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  if (DATA.links && DATA.links["3d"]) { $("other").href = DATA.links["3d"]; $("other").hidden = false; }
  const RUNS = DATA.runs || [{ run: DATA.run, kind: "", session_seconds: DATA.session_seconds }];
  DATA.sessions.forEach((s) => { s.run = s.run || DATA.run; if (s.session_seconds === undefined) s.session_seconds = DATA.session_seconds; });
  $("runlbl").textContent = `${RUNS.length > 1 ? RUNS.length + " runs" : "run " + RUNS[0].run} · ${DATA.sessions.length} sessions · replayed from logs`;

  // ------------------------------------------------------------- terrain
  function hAt(x, y) {
    const gx = Math.min(N - 1.001, Math.max(0, x / SIZE * N - 0.5)), gy = Math.min(N - 1.001, Math.max(0, y / SIZE * N - 0.5));
    const i = Math.floor(gx), j = Math.floor(gy), fx = gx - i, fy = gy - j, H = T.h;
    return (H[j][i] * (1 - fx) + H[j][i + 1] * fx) * (1 - fy) + (H[j + 1][i] * (1 - fx) + H[j + 1][i + 1] * fx) * fy;
  }
  const RAMP = [[-3, [24, 58, 92]], [T.wade, [46, 102, 140]], [T.sea - 0.001, [104, 168, 196]], [T.sea, [222, 208, 160]], [0.5, [196, 205, 146]],
    [1.5, [150, 182, 112]], [2.6, [104, 150, 86]], [3.6, [92, 122, 74]], [4.6, [128, 116, 88]], [6, [150, 138, 120]]];
  function ramp(h) {
    if (h <= RAMP[0][0]) return RAMP[0][1];
    for (let k = 1; k < RAMP.length; k++) if (h <= RAMP[k][0]) {
      const [h0, c0] = RAMP[k - 1], [h1, c1] = RAMP[k], t = (h - h0) / Math.max(1e-6, h1 - h0);
      return c0.map((v, m) => v + (c1[m] - v) * t);
    }
    return RAMP[RAMP.length - 1][1];
  }
  const RES = 640;
  const terr = document.createElement("canvas"); terr.width = terr.height = RES;
  (function paintTerrain() {
    const g = terr.getContext("2d"), img = g.createImageData(RES, RES), hs = new Float32Array(RES * RES);
    for (let py = 0; py < RES; py++) for (let px = 0; px < RES; px++) hs[py * RES + px] = hAt((px + 0.5) / RES * SIZE, SIZE - (py + 0.5) / RES * SIZE);
    const [sx, sy, , sr] = T.spire, d = SIZE / RES;
    for (let py = 0; py < RES; py++) for (let px = 0; px < RES; px++) {
      const k = py * RES + px, h = hs[k];
      let c = ramp(h);
      const wx = (px + 0.5) * d, wy = SIZE - (py + 0.5) * d;
      if (Math.hypot(wx - sx, wy - sy) < sr - 0.1) c = [96, 90, 84];
      const hl = hs[py * RES + Math.max(0, px - 1)], hr = hs[py * RES + Math.min(RES - 1, px + 1)];
      const hu = hs[Math.max(0, py - 1) * RES + px], hd = hs[Math.min(RES - 1, py + 1) * RES + px];
      let shade = 1;
      if (h > T.sea) { const nx = (hl - hr) / (2 * d), ny = (hu - hd) / (2 * d); shade = Math.max(0.55, Math.min(1.25, 1 + 0.55 * (nx * 0.7 - ny * 0.7))); }
      const band = (v) => Math.floor(v / 0.5);
      const contour = h > T.sea && (band(h) !== band(hr) || band(h) !== band(hd));
      const major = contour && (Math.floor(h) !== Math.floor(hr) || Math.floor(h) !== Math.floor(hd));
      const f = contour ? (major ? 0.62 : 0.8) : 1;
      img.data[k * 4] = Math.min(255, c[0] * shade * f); img.data[k * 4 + 1] = Math.min(255, c[1] * shade * f);
      img.data[k * 4 + 2] = Math.min(255, c[2] * shade * f); img.data[k * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  })();

  // ------------------------------------------------------------- state
  const akey = (s) => s.run + "|" + s.agent;
  const byAgent = {};
  DATA.sessions.forEach((s, i) => { (byAgent[akey(s)] = byAgent[akey(s)] || []).push(i); });
  const agentName = (k) => k.split("|")[1];
  const agents = Object.keys(byAgent).sort((a, b) => (agentName(a).startsWith("fresh") - agentName(b).startsWith("fresh")) || a.localeCompare(b, undefined, { numeric: true }));
  let S = null, si = -1, cur = 0, t = 0, playing = false, last = 0;
  let view = { cx: SIZE / 2, cy: SIZE / 2, zoom: 1 }, follow = false, tab = "log";
  const filt = { say: true, think: false, act: true, note: true, nudge: false, read: true, rule: true };

  function store(k, v) { try { localStorage.setItem("eko." + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { const v = localStorage.getItem("eko." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  Object.assign(filt, load("filt", {}));
  for (const k of ["say", "think", "act", "note", "nudge"]) {
    const el = $("f-" + k); el.checked = !!filt[k];
    el.addEventListener("change", () => { filt[k] = el.checked; store("filt", filt); renderPane(true); });
  }

  // ------------------------------------------------------------- picker
  function spawnCount(s) { return s.timeline.filter((e) => e.k === "rule").length; }
  function renderPicker() {
    const ag = akey(S);
    const mk = (parent, label, pressed, onclick, extra) => {
      const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", pressed ? "true" : "false");
      b.innerHTML = esc(label) + (extra || ""); b.onclick = onclick; parent.appendChild(b); return b;
    };
    for (const id of ["runs", "agents", "days", "tasks"]) { const r = $(id); while (r.children.length > 1) r.lastChild.remove(); }
    $("runs").hidden = RUNS.length < 2;
    RUNS.forEach((r) => mk($("runs"), r.run, r.run === S.run, () => {
      const same = DATA.sessions.findIndex((x) => x.run === r.run && x.agent === S.agent);
      openSession(same >= 0 ? same : DATA.sessions.findIndex((x) => x.run === r.run));
    }, r.kind ? `<span class="sc">${esc(r.kind)}</span>` : ""));
    agents.filter((a) => a.split("|")[0] === S.run).forEach((a) => mk($("agents"), agentName(a).replace("_", " "), a === ag, () => {
      const same = byAgent[a].find((i) => DATA.sessions[i].label === S.label);
      openSession(same != null ? same : byAgent[a][0]);
    }));
    const days = byAgent[ag].filter((i) => DATA.sessions[i].phase === "A"), tasks = byAgent[ag].filter((i) => DATA.sessions[i].phase === "B");
    $("days").hidden = !days.length;
    days.forEach((i) => { const s = DATA.sessions[i], n = spawnCount(s);
      mk($("days"), s.label.replace("Day ", "D"), i === si, () => openSession(i), n ? `<span class="dot" title="${n} hidden-rule events"></span>` : ""); });
    tasks.forEach((i) => { const s = DATA.sessions[i];
      mk($("tasks"), s.label.replace(/_/g, " "), i === si, () => openSession(i), s.end.score != null ? `<span class="sc">${esc(s.end.score)}</span>` : ""); });
  }

  function hashFor(i) { const s = DATA.sessions[i]; return ((RUNS.length > 1 ? s.run + "." : "") + s.id).replace(/[^A-Za-z0-9._~-]/g, "-"); }
  const skey = (s) => s.run + ":" + s.id;
  function openSession(i, keepStep) {
    si = i; S = DATA.sessions[i]; cur = keepStep ? Math.min(cur, S.frames.length - 1) : 0; t = 0;
    $("scrub").max = S.frames.length - 1; $("scrub").value = cur;
    try { history.replaceState(null, "", "#" + hashFor(i)); } catch (e) {}
    store("session", skey(S));
    renderPicker(); renderPane(true); drawElev(); draw();
  }

  // ------------------------------------------------------------- map
  const cv = $("map"), ctx = cv.getContext("2d");
  let W = 0, DPR = 1;
  function resize() {
    const r = $("mapwrap").getBoundingClientRect(); DPR = window.devicePixelRatio || 1; W = r.width;
    cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
    const e = $("elev"), er = e.getBoundingClientRect(); e.width = Math.round(er.width * DPR); e.height = Math.round(er.height * DPR);
    draw(); drawElev();
  }
  const scale = () => W / SIZE * view.zoom;
  const toS = (x, y) => [(x - view.cx) * scale() + W / 2, (view.cy - y) * scale() + W / 2];
  const toW = (sx, sy) => [(sx - W / 2) / scale() + view.cx, view.cy - (sy - W / 2) / scale()];
  function clampView() {
    const half = SIZE / 2 / view.zoom;
    view.cx = Math.min(SIZE - half, Math.max(half, view.cx)); view.cy = Math.min(SIZE - half, Math.max(half, view.cy));

  if (start < 0) start = DATA.sessions.findIndex((s) => skey(s) === load("session", ""));
  if (start < 0) start = Math.max(0, DATA.sessions.findIndex((s) => s.phase === "A" && spawnCount(s) > 0));
  openSession(start);
  const firstRule = S.timeline.find((e) => e.k === "rule");
  if (firstRule && !h) seek(Math.max(0, firstRule.f - 4));
  resize();
})();
