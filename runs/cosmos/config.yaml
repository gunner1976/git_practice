  refusal_fallback: true
  soul_path: paper/system_prompt.md
  steps_per_session: 150
  max_notes_ops_per_session: 100000
  end_grace_turns: 0
  max_api_calls_per_session: 1500
  max_stop_nudges: 100000
  show_steps_remaining: false
  inject_notes: false
  describe_landmarks: false
  stop_hook_message: Please don't stop. Just continue doing whatever you want to do.
  session_start_message: Begin
  session_end_message: The light is fading; this day is ending and the island will
    reset. Nothing more can happen in the world today, but you may still read or write
    your notes.
  interface: paper
  workspace_template: paper/workspace
  memory_injection: paper
  initial_observation: false
  stop_hook_observation: false
  context_prune_chars: 240000
  clock:
    session_seconds: 1200
    turn_seconds: 8.0
    seconds_per_output_token: 0.025
    action_seconds: 1.0
    walk_speed: 4.0
    query_seconds: 0.5
    warn_before_seconds: 300
    warn_message: You will be reset in 5 minutes. Update your workspace memory files
      now.
    start_utc: '2026-05-01T08:00:00Z'
phase_a:
  n_agents: 3
  n_sessions: 10
  parallel_agents: 3
phase_b:
  n_fresh: null
  world_seed: null
  steps_per_task: null
  task_message: 'A voice carries over the island: "{task}" You have about {steps}
    moments.'
  tasks:
    spire_objects: Put as many objects as you can on top of the Spire.
    tallest_tower: Build the tallest stable tower you can.
    ring_on_peak: Get the ring onto the Peak.
    make_cubes: Produce as many cubes as you can.
ladder:
  contestants:
  - id: curious
    soul: soul.md
  - id: systematic
    soul: souls/systematic.md
  - id: minimal
    soul: souls/minimal.md
  replicates: 2
  steps_per_session: null
  eval_message: Something is hidden on this island. See what you can find.
  transfer_check: true
  stages:
  - name: tier1
    rules:
    - rock_spawn
    targets:
    - rock_spawn
    free_sessions: 3
    eval_seeds:
    - 1101
    - 1102
    - 1103
    min_seeds: 2
  - name: tier2
    rules:
    - rock_spawn
    - stack_chime
    targets:
    - stack_chime
    free_sessions: 3
    eval_seeds:
    - 1201
    - 1202
    - 1203
    min_seeds: 2
  - name: tier3
    rules:
    - rock_spawn
    - stack_chime
    - patient_ring
    targets:
    - patient_ring
    free_sessions: 4
    eval_seeds:
    - 1301
    - 1302
    - 1303
    min_seeds: 2
  - name: tier4_transfer
    rules:
    - rock_spawn
    - stack_chime
    - patient_ring
    randomize: true
    targets:
    - rock_spawn
    - stack_chime
    - patient_ring
    advance: all
    free_sessions: 1
    eval_seeds:
    - 1401
    - 1402
    - 1403
    min_seeds: 2
