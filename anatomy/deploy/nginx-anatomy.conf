# Anatomy Explorer — nginx snippets. Static files only; no backend.
# Option A: subpath on the existing site. Put inside the `server { }` block for gunninginc.click.
location /anatomy/ {
    alias /var/www/anatomy/;
    index index.html;
    try_files $uri $uri/ /anatomy/index.html;
    types { model/gltf-binary glb; application/wasm wasm; image/x-exr exr; }
    gzip_static on;
    location ~* \.(glb|webp|exr|wasm)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.(js|css)$ { expires 7d; add_header Cache-Control "public"; }
}

